
name: Build AnimeScapeAI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Install Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            gettext autopoint \
            ccache

      # 5. Install Android SDK packages
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 6. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            buildozer \
            "Cython==0.29.34" \
            virtualenv

      # 7. Check project files
      - name: Check project configuration
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "Project files found."

      # 8. Build APK
      - name: Build debug APK
        run: |
          buildozer -v android debug

      # 9. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeScapeAI-Studio-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
